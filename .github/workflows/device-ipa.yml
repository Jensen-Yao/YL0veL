name: Build Device IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project (sideload spec, no Watch)
        run: xcodegen generate --spec project-sideload.yml

      - name: Build for device (unsigned)
        run: |
          xcodebuild -project YL0veL.xcodeproj -scheme YL0veL \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YL0veL.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload YL0veL-device.ipa
          ls -lh YL0veL-device.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YL0veL-device-ipa
          path: YL0veL-device.ipa
          retention-days: 14
