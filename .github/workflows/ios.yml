name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild build \
            -project YL0veL.xcodeproj \
            -scheme YL0veL \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];all_=[x for v in d.values() for x in v if x.get('isAvailable') and x['name'].startswith('iPhone')];print(sorted(all_,key=lambda x:x['name'])[-1]['name'] if all_ else '')")
          echo "Using simulator: $SIM_NAME"
          xcodebuild test \
            -project YL0veL.xcodeproj \
            -scheme YL0veL \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO
