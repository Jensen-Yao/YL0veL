name: Simulator Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Boot simulator & capture screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];all_=[x for v in d.values() for x in v if x.get('isAvailable') and x['name'].startswith('iPhone')];print(sorted(all_,key=lambda x:x['name'])[-1]['udid'])")
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];all_=[x for v in d.values() for x in v if x.get('isAvailable') and x['name'].startswith('iPhone')];print(sorted(all_,key=lambda x:x['name'])[-1]['name'])")
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"
          echo "Simulator: $SIM_UDID ($SIM_NAME)"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Run UI tests to capture screenshots
        run: |
          xcodebuild test \
            -project YL0veL.xcodeproj \
            -scheme YL0veLUITests \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath ui-tests.xcresult \
            -only-testing:YL0veLUITests
          mkdir -p docs/screenshots exported
          xcrun xcresulttool export attachments --path ui-tests.xcresult --output-path exported 2>/dev/null || true
          echo "=== exported attachments ==="
          ls -la exported/ || true
          for f in exported/*.png; do
            base=$(basename "$f")
            echo "copy $base"
            cp "$f" "docs/screenshots/$base"
          done
          ls -la docs/screenshots/

      - name: Commit screenshots back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          git commit -m "docs: 模拟器截图（自动生成）" || echo "no changes"
          git push
