<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给桃桃的礼物</title>
<style>
  :root {
    --pink: #f2599e;
    --pink-deep: #cc3864;
    --bg: #fff0f6;
    --text: #4a2b36;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(170deg, #ffe0ee 0%, #fff0f6 45%, #ffe8f3 100%);
    color: var(--text);
    overflow-x: hidden;
  }

  /* 星空背景 */
  #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #fireworksCanvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* ===== 解锁层（礼物盒） ===== */
  #lockScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50;
    transition: opacity .8s ease, visibility .8s;
  }
  #lockScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .lock-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: 2px; }
  .lock-sub { font-size: 13px; color: #9a6a7d; margin-bottom: 34px; }

  .gift-float { animation: giftIdle 3.2s ease-in-out infinite; }
  @keyframes giftIdle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

  .giftbox { position: relative; width: 170px; height: 150px; }
  .giftbox::before {
    content: ""; position: absolute; inset: -16px; border-radius: 50%; z-index: 0;
    background: radial-gradient(circle, rgba(255,150,195,.4), rgba(255,150,195,0) 68%);
    animation: glowPulse 3.2s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%,100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
  .box-lid {
    position: absolute; top: 0; left: 15px; width: 140px; height: 34px;
    background: linear-gradient(180deg, #ff8fba, #f2599e);
    border-radius: 6px; z-index: 3; overflow: hidden;
    transition: transform .9s cubic-bezier(.34,1.56,.64,1), opacity .9s;
  }
  .box-lid::after {
    content: ""; position: absolute; top: 0; left: -30%; width: 40%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg);
    animation: shineSweep 3.4s ease-in-out infinite;
  }
  @keyframes shineSweep { 0%, 55% { left: -30%; } 88%, 100% { left: 115%; } }
  .box-body {
    position: absolute; top: 28px; left: 22px; width: 126px; height: 96px;
    background: linear-gradient(180deg, #ff6fa5, #e64988);
    border-radius: 0 0 10px 10px; z-index: 2;
    box-shadow: inset 0 -12px 20px rgba(0,0,0,.12);
    transition: transform .9s ease, opacity .9s;
  }
  .ribbon-v {
    position: absolute; top: 28px; left: 78px; width: 14px; height: 96px;
    background: #ffd9e8; z-index: 4;
  }
  .ribbon-h {
    position: absolute; top: 60px; left: 22px; width: 126px; height: 14px;
    background: #ffd9e8; z-index: 4;
  }
  .bow {
    position: absolute; top: -16px; left: 58px; width: 54px; height: 34px; z-index: 5;
    transform-origin: center top;
    animation: bowSway 2.8s ease-in-out infinite;
  }
  @keyframes bowSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .bow::before, .bow::after {
    content: ""; position: absolute; top: 6px;
    width: 26px; height: 20px; background: #ffd9e8; border-radius: 50% 50% 20% 20%;
  }
  .bow::before { left: 0; transform: rotate(-24deg); }
  .bow::after { right: 0; transform: rotate(24deg); }
  .bow-knot {
    position: absolute; top: 14px; left: 21px; width: 12px; height: 12px;
    background: #ffb8d4; border-radius: 50%; z-index: 6;
  }

  .giftbox.shake { animation: shake .5s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px) rotate(-2deg); }
    40% { transform: translateX(9px) rotate(2deg); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(7px); }
  }

  .giftbox.open .box-lid {
    transform: translateY(-95px) rotate(26deg);
    opacity: 0;
  }
  .giftbox.open .box-body {
    transform: translateY(26px) scale(.9);
  }
  .giftbox.open .ribbon-v, .giftbox.open .ribbon-h, .giftbox.open .bow, .giftbox.open .bow-knot {
    animation: fadeOut .9s forwards;
  }
  .giftbox.open::before { animation: none; opacity: 0; transition: opacity .6s; }
  @keyframes fadeOut { to { opacity: 0; } }

  .sparkle {
    position: absolute; width: 10px; height: 10px; z-index: 10;
    font-size: 18px; animation: sparkleFly 1.1s ease-out forwards; pointer-events: none;
  }
  @keyframes sparkleFly {
    0% { transform: translate(0,0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.25); opacity: 0; }
  }

  .confetti {
    position: fixed; z-index: 60; width: 8px; height: 13px; border-radius: 2px; pointer-events: none;
    animation: confettiFall var(--t) cubic-bezier(.25,.46,.45,.94) forwards;
  }
  @keyframes confettiFall {
    0% { transform: translate(0,0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--x), 92vh) rotate(var(--rot)); opacity: .85; }
  }

  .lock-form { margin-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lock-input {
    width: 210px; padding: 12px 16px; border: 2px solid #ffb8d4; border-radius: 999px;
    font-size: 16px; text-align: center; outline: none; background: #fff;
    letter-spacing: 4px;
  }
  .lock-input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(242,89,158,.12); }
  .lock-btn {
    width: 210px; padding: 12px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 10px 24px rgba(242,89,158,.3);
    transition: transform .15s ease;
  }
  .lock-btn:active { transform: scale(.96); }
  .lock-error { font-size: 13px; color: #e0457c; min-height: 18px; }

  /* ===== 内容层 ===== */
  #birthdayContent { position: relative; z-index: 1; display: none; padding-bottom: 56px; }
  #birthdayContent.revealed { display: block; }
  #birthdayContent section, #birthdayContent footer {
    opacity: 0; transform: translateY(30px);
  }
  #birthdayContent.revealed section, #birthdayContent.revealed footer {
    opacity: 1; transform: none;
    transition: opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1);
  }
  #birthdayContent.revealed section:nth-child(1) { transition-delay: .15s; }
  #birthdayContent.revealed section:nth-child(2) { transition-delay: .45s; }
  #birthdayContent.revealed section:nth-child(3) { transition-delay: .8s; }
  #birthdayContent.revealed section:nth-child(4) { transition-delay: 1.15s; }
  #birthdayContent.revealed section:nth-child(5) { transition-delay: 1.5s; }
  #birthdayContent.revealed section:nth-child(6) { transition-delay: 1.8s; }
  #birthdayContent.revealed section:nth-child(7) { transition-delay: 2.05s; }
  #birthdayContent.revealed section:nth-child(8) { transition-delay: 2.25s; }
  #birthdayContent.revealed section:nth-child(9) { transition-delay: 2.45s; }
  #birthdayContent.revealed section:nth-child(10) { transition-delay: 2.6s; }
  #birthdayContent.revealed section:nth-child(11) { transition-delay: 2.72s; }
  #birthdayContent.revealed footer { transition-delay: 2.85s; }

  .opening { text-align: center; padding: 64px 24px 8px; }
  .butler { font-size: 62px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .opening h1 { margin-top: 12px; font-size: 32px; background: linear-gradient(135deg, var(--pink), var(--pink-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .opening .sub { margin-top: 8px; font-size: 14px; color: #9a6a7d; }

  .petal {
    position: fixed; top: -30px; z-index: 2; pointer-events: none;
    animation: petalFall linear forwards;
  }
  @keyframes petalFall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: .9; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  /* 管家 Y 自述 */
  .butler-intro { max-width: 580px; margin: 0 auto; padding: 34px 22px 6px; }
  .butler-card { display: flex; gap: 14px; align-items: flex-start; }
  .butler-avatar {
    font-size: 42px; background: #fff; border-radius: 50%; padding: 10px; flex: none;
    box-shadow: 0 8px 20px rgba(242,89,158,.18);
  }
  .bubble {
    background: #fff; border-radius: 18px; padding: 16px 18px; position: relative;
    box-shadow: 0 8px 22px rgba(242,89,158,.14);
    font-size: 14.5px; line-height: 1.9;
  }
  .bubble::before {
    content: ""; position: absolute; left: -7px; top: 26px; width: 15px; height: 15px;
    background: #fff; transform: rotate(45deg);
  }
  .bubble p { margin-bottom: 8px; }
  .bubble p:last-child { margin-bottom: 0; }

  /* 银河鹊桥 */
  .bridge-wrap { max-width: 580px; margin: 0 auto; padding: 30px 22px 6px; }
  .bridge-wrap h2 { text-align: center; font-size: 21px; margin-bottom: 14px; }
  .bridge-card {
    background: #fff; border-radius: 22px; padding: 14px; text-align: center;
    box-shadow: 0 12px 32px rgba(60,30,90,.18);
  }
  .sky {
    position: relative; height: 310px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #160f3d 0%, #37236b 52%, #66407e 100%);
  }
  .galaxy {
    position: absolute; top: -22%; left: -12%; right: -12%; height: 62%;
    transform: rotate(-16deg); filter: blur(5px);
    background: linear-gradient(180deg,
      rgba(255,255,255,0) 0%, rgba(255,228,250,.16) 42%,
      rgba(210,180,255,.1) 55%, rgba(255,255,255,0) 100%);
  }
  .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
  .s1 { top: 12%; left: 18%; animation-delay: 0s; }
  .s2 { top: 8%; left: 62%; animation-delay: .4s; }
  .s3 { top: 22%; left: 40%; animation-delay: .8s; }
  .s4 { top: 16%; left: 82%; animation-delay: 1.2s; }
  .s5 { top: 32%; left: 8%; animation-delay: 1.6s; }
  .s6 { top: 40%; left: 90%; animation-delay: .2s; }
  .s7 { top: 60%; left: 6%; animation-delay: 1s; }
  .s8 { top: 58%; left: 94%; animation-delay: 1.4s; }
  .s9 { top: 70%; left: 30%; animation-delay: .6s; }
  .moon {
    position: absolute; top: 11%; right: 10%; font-size: 34px;
    filter: drop-shadow(0 0 14px rgba(255,240,190,.85));
    animation: float 5s ease-in-out infinite;
  }
  .lover {
    position: absolute; bottom: 14%; display: flex; flex-direction: column; align-items: center;
    font-size: 30px; z-index: 3;
    transition: left 1.9s cubic-bezier(.34,1.2,.5,1), right 1.9s cubic-bezier(.34,1.2,.5,1), bottom 1.9s ease;
  }
  .lover span { font-size: 11px; color: #ffe3ec; margin-top: 2px; font-weight: 700; }
  .lover-l { left: 9%; }
  .lover-y { right: 9%; }
  .sky.met .lover-l { left: 41%; }
  .sky.met .lover-y { right: 41%; }
  .sky.met .lover { bottom: 19%; }
  .shoot {
    position: absolute; width: 76px; height: 1.6px; border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(255,255,255,0));
    animation: shoot 6.5s linear infinite;
  }
  .shoot1 { top: 12%; left: 64%; }
  .shoot2 { top: 26%; left: 84%; animation-delay: 3.4s; }
  @keyframes shoot {
    0% { transform: translate(0, 0) rotate(-27deg); opacity: 0; }
    4% { opacity: 1; }
    13% { transform: translate(-130px, 58px) rotate(-27deg); opacity: 0; }
    100% { transform: translate(-130px, 58px) rotate(-27deg); opacity: 0; }
  }
  .birds { position: absolute; inset: 0; pointer-events: none; }
  .bird {
    position: absolute; font-size: 15px; opacity: 0;
    animation: birdFly 1.5s ease-in forwards;
  }
  @keyframes birdFly {
    0% { left: var(--from); top: 66%; opacity: 0; transform: scale(.6); }
    22% { opacity: 1; }
    55% { top: 26%; }
    100% { left: calc(50% + var(--dir) * var(--land, 0px)); top: 48%; opacity: 1; transform: scale(.85); }
  }
  .bridge {
    position: absolute; left: 13%; right: 13%; top: 47%; height: 36px;
    opacity: 0; transform: scaleX(.35); z-index: 2;
    transition: opacity .9s ease, transform .9s cubic-bezier(.22,1.4,.36,1);
  }
  .bridge::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
    border: 4px solid #f7bd85; border-bottom: none;
    border-radius: 50% / 100% 100% 0 0;
    background: linear-gradient(180deg, rgba(255,214,150,.3), rgba(255,180,120,.1));
    box-shadow: 0 0 18px rgba(255,190,130,.4);
  }
  .bridge::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: 6px; height: 20px;
    border: 2px solid rgba(247,189,133,.7); border-bottom: none;
    border-radius: 50% / 100% 100% 0 0;
  }
  .bridge.built { opacity: 1; transform: scaleX(1); }
  .hearts { position: absolute; inset: 0; pointer-events: none; }
  .hearts span {
    position: absolute; top: 36%; font-size: 20px;
    animation: heartRise 1.7s ease-out forwards;
  }
  @keyframes heartRise {
    from { transform: translate(-50%, 0) scale(.5); opacity: 1; }
    to { transform: translate(-50%, -84px) scale(1.35); opacity: 0; }
  }
  .bridge-hint { margin-top: 10px; font-size: 13px; color: #9a6a7d; min-height: 18px; }
  .bridge-btn {
    margin-top: 8px; padding: 11px 26px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #8b5cf6, #6d3fd1); color: #fff;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    box-shadow: 0 8px 20px rgba(109,63,209,.35);
    transition: transform .15s ease, opacity .3s ease;
  }
  .bridge-btn:active { transform: scale(.96); }

  /* 羊皮纸信 */
  .letter { max-width: 620px; margin: 0 auto; padding: 44px 24px 8px; }
  .letter h2 { text-align: center; font-size: 21px; margin-bottom: 18px; }
  .letter-body {
    position: relative;
    background:
      radial-gradient(ellipse at 18% 8%, rgba(255,255,255,.4), transparent 55%),
      radial-gradient(ellipse at 85% 92%, rgba(158,105,46,.14), transparent 52%),
      radial-gradient(ellipse at 60% 40%, rgba(158,105,46,.07), transparent 60%),
      linear-gradient(150deg, #f8ecd3 0%, #efdfb8 55%, #e7d2a5 100%);
    border-radius: 6px 20px 8px 22px / 20px 8px 24px 10px;
    padding: 34px 28px 44px;
    box-shadow:
      inset 0 0 46px rgba(139,94,43,.22),
      inset 0 0 6px rgba(139,94,43,.3),
      0 18px 44px rgba(120,80,50,.18);
    font-family: "Xingkai SC", "STXingkai", "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 17px; line-height: 2.05; color: #59432e;
  }
  .ornament { text-align: center; color: #c69a5c; font-size: 20px; margin-bottom: 6px; }
  .letter-body p { margin-bottom: 10px; text-indent: 0; }
  .sign { text-align: right; font-weight: 700; }
  .seal {
    position: absolute; right: 28px; bottom: 26px; width: 62px; height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e0524d, #b02320 72%);
    color: #ffe9e9; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1.15; font-family: "STXingkai", "Xingkai SC", "KaiTi", serif;
    transform: rotate(-10deg);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), inset 0 0 9px rgba(90,0,0,.45), 0 4px 12px rgba(150,20,15,.35);
  }
  .seal::after {
    content: ""; position: absolute; inset: 5px; border: 1px dashed rgba(255,233,233,.5); border-radius: 50%;
  }

  /* 语音 */
  .voice-note { text-align: center; padding: 26px 0 8px; }
  .voice-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 30px; border-radius: 999px; cursor: pointer; border: none;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    color: #fff; font-size: 16px; font-weight: 600;
    box-shadow: 0 10px 26px rgba(242,89,158,.3);
    transition: transform .15s ease;
  }
  .voice-btn:active { transform: scale(.96); }
  .voice-btn.playing { animation: btnPulse 1.2s ease-in-out infinite; }
  @keyframes btnPulse { 0%,100% { box-shadow: 0 10px 26px rgba(242,89,158,.3); } 50% { box-shadow: 0 10px 34px rgba(242,89,158,.6); } }
  .voice-btn.playing .play-icon { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  .hint { margin-top: 10px; font-size: 12px; color: #9a6a7d; }

  /* 声波 */
  .wave { display: inline-flex; align-items: center; gap: 3px; height: 16px; }
  .wave i {
    width: 3px; height: 6px; border-radius: 2px; background: rgba(255,255,255,.85);
    transition: height .25s ease;
  }
  .voice-btn.playing .wave i { animation: waveBounce 1s ease-in-out infinite; }
  .voice-btn.playing .wave i:nth-child(1) { animation-delay: 0s; }
  .voice-btn.playing .wave i:nth-child(2) { animation-delay: .15s; }
  .voice-btn.playing .wave i:nth-child(3) { animation-delay: .3s; }
  .voice-btn.playing .wave i:nth-child(4) { animation-delay: .45s; }
  .voice-btn.playing .wave i:nth-child(5) { animation-delay: .6s; }
  @keyframes waveBounce { 0%,100% { height: 5px; } 50% { height: 15px; } }

  /* App 介绍 */
  .app-intro { max-width: 580px; margin: 0 auto; padding: 38px 22px 6px; }
  .app-intro h2 { text-align: center; font-size: 21px; margin-bottom: 6px; }
  .app-intro .lead { text-align: center; font-size: 13px; color: #9a6a7d; margin-bottom: 16px; line-height: 1.7; }
  .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .app-card {
    background: #fff; border-radius: 16px; padding: 14px 14px 12px;
    box-shadow: 0 8px 20px rgba(242,89,158,.12);
    transition: transform .25s ease;
  }
  .app-card:active { transform: scale(.97); }
  .app-card .icon { font-size: 25px; }
  .app-card h3 { font-size: 14.5px; margin: 6px 0 3px; }
  .app-card p { font-size: 12px; color: #9a6a7d; line-height: 1.6; }

  /* 开场标题逐字浮现 */
  .opening h1 .ch {
    display: inline-block; opacity: 0;
    animation: chIn .55s cubic-bezier(.22,1.4,.36,1) forwards;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes chIn { from { opacity: 0; transform: translateY(14px) scale(.7); } to { opacity: 1; transform: none; } }

  /* 信纸卷角 + 首字下沉 */
  .letter-body::after {
    content: ""; position: absolute; top: 0; right: 0; width: 46px; height: 46px;
    background: linear-gradient(315deg, #f7ecd2 0 38%, #dcc394 38% 46%, #b8995f 46% 100%);
    border-radius: 0 20px 0 0; opacity: .95;
    box-shadow: -4px 4px 10px rgba(120,80,50,.18);
  }
  .letter-body p:first-of-type::first-letter {
    font-size: 1.9em; color: #b02320; font-weight: 700; margin-right: 2px;
  }

  /* App 界面截图 */
  .screenshots { max-width: 580px; margin: 0 auto; padding: 42px 0 6px; }
  .screenshots h2 { text-align: center; font-size: 21px; margin-bottom: 6px; }
  .screenshots .lead { text-align: center; font-size: 13px; color: #9a6a7d; margin-bottom: 16px; }
  .shot-track {
    display: flex; gap: 14px; overflow-x: auto; padding: 6px 22px 14px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .shot-track::-webkit-scrollbar { display: none; }
  .shot {
    flex: none; width: 190px; scroll-snap-align: center; text-align: center;
  }
  .phone {
    background: #fff; border-radius: 22px; padding: 8px;
    box-shadow: 0 12px 30px rgba(120,60,90,.2);
    border: 1px solid #ffe3ee;
  }
  .phone img {
    width: 100%; aspect-ratio: 390/844; object-fit: cover; object-position: top;
    border-radius: 15px; display: block;
  }
  .shot p { margin-top: 8px; font-size: 12.5px; color: #9a6a7d; }
  .shot-tip { text-align: center; font-size: 12px; color: #c08aa0; margin-top: 2px; }

  /* 许愿星 */
  .wish { max-width: 580px; margin: 0 auto; padding: 40px 22px 6px; text-align: center; }
  .wish h2 { font-size: 21px; margin-bottom: 6px; }
  .wish .lead { font-size: 13px; color: #9a6a7d; margin-bottom: 16px; }
  .wish-box { display: flex; gap: 10px; justify-content: center; }
  .wish-input {
    flex: 1; max-width: 260px; padding: 12px 16px; border: 2px solid #ffb8d4; border-radius: 999px;
    font-size: 14px; outline: none; background: #fff; color: var(--text);
  }
  .wish-input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(242,89,158,.12); }
  .wish-btn {
    padding: 12px 20px; border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, #ffd166, #ff9f43); color: #6b4a10;
    font-size: 14px; font-weight: 700;
    box-shadow: 0 8px 20px rgba(255,159,67,.35);
    transition: transform .15s ease;
  }
  .wish-btn:active { transform: scale(.96); }
  .wish-tip { margin-top: 12px; font-size: 13px; color: #9a6a7d; min-height: 18px; }
  .wish-star-fly {
    position: fixed; z-index: 4; pointer-events: none; font-size: 22px;
    animation: starFly 1.6s cubic-bezier(.3,.7,.4,1) forwards;
  }
  @keyframes starFly {
    0% { transform: translate(0, 0) scale(.5); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--fx), var(--fy)) scale(1.15); opacity: 0; }
  }

  /* 烟花 */
  .fireworks { text-align: center; padding: 34px 0 8px; }
  .fireworks-btn {
    padding: 14px 32px; border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, #8b5cf6, #6d3fd1); color: #fff;
    font-size: 16px; font-weight: 600;
    box-shadow: 0 10px 26px rgba(109,63,209,.35);
    transition: transform .15s ease;
  }
  .fireworks-btn:active { transform: scale(.96); }

  .gift-hint { text-align: center; padding: 44px 24px; font-size: 18px; font-weight: 600; }
  .gift-hint .small { margin-top: 8px; font-size: 13px; font-weight: 400; color: #9a6a7d; }

  .ending { text-align: center; padding: 16px; font-size: 13px; color: #9a6a7d; }
  .ending-sub { margin-top: 4px; font-size: 12px; }
</style>
</head>

  /* ---------- 星空背景 ---------- */
  (function starfield() {
    const cv = document.getElementById('starfield');
    const ctx = cv.getContext('2d');
    let stars = [], shooting = [];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
      cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.min(130, Math.floor(innerWidth * innerHeight / 2600));
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: .4 + Math.random() * 1.1,
        phase: Math.random() * Math.PI * 2, speed: .6 + Math.random() * 1.6,
        gold: Math.random() < .3,
      }));
    }
    resize();
    addEventListener('resize', resize);
    let t = 0, nextShoot = 200;
    function frame(ts) {
      t = ts / 1000;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) {
        const a = .25 + .5 * (Math.sin(t * s.speed + s.phase) + 1) / 2;
        ctx.fillStyle = s.gold ? 'rgba(255,214,140,' + a + ')' : 'rgba(255,255,255,' + a + ')';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      if (t * 1000 > nextShoot) {
        nextShoot = t * 1000 + 3800 + Math.random() * 4200;
        shooting.push({ x: Math.random() * innerWidth * .7, y: Math.random() * innerHeight * .3, life: 0, len: 90 + Math.random() * 60, vx: 4.5 + Math.random() * 2.5, vy: 2 + Math.random() * 1.4 });
      }
      shooting = shooting.filter(sh => sh.life < 1);
      for (const sh of shooting) {
        sh.life += .028; sh.x += sh.vx; sh.y += sh.vy;
        const a = Math.sin(Math.PI * Math.min(sh.life, 1));
        const g = ctx.createLinearGradient(sh.x, sh.y, sh.x - sh.len, sh.y - sh.len * .45);
        g.addColorStop(0, 'rgba(255,255,255,' + (a * .9) + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x - sh.len, sh.y - sh.len * .45); ctx.stroke();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- 加密解密 ---------- */
  function b64ToBuf(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function tryDecrypt(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBuf(ENCRYPTED.salt), iterations: ENCRYPTED.iterations, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    try {
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBuf(ENCRYPTED.iv) },
        key,
        b64ToBuf(ENCRYPTED.ct)
      );
      return new TextDecoder().decode(pt);
    } catch (e) {
      return null;
    }
  }

  /* ---------- 动效 ---------- */
  function launchPetals() {
    for (let i = 0; i < 24; i++) {
      setTimeout(() => {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.textContent = ['🌸','💗','✨','💮'][Math.floor(Math.random() * 4)];
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.fontSize = (12 + Math.random() * 14) + 'px';
        petal.style.animationDuration = (5 + Math.random() * 5) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 12000);
      }, i * 150);
    }
  }

  function launchConfetti() {
    const rect = giftbox.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + 16;
    const colors = ['#f2599e', '#ff8fba', '#ffd166', '#ff6b6b', '#c084fc', '#ff9f43', '#ffd9e8'];
    for (let i = 0; i < 44; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--x', (Math.random() * 240 - 120) + 'px');
      p.style.setProperty('--rot', (Math.random() * 1080 - 540) + 'deg');
      p.style.setProperty('--t', (1.6 + Math.random() * 1.4) + 's');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3200);
    }
  }

  function openGift() {
    giftbox.classList.add('open');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = ['✨','💖','🎀'][i % 3];
      s.style.left = '50%';
      s.style.top = '40%';
      s.style.setProperty('--dx', (Math.random() * 230 - 115) + 'px');
      s.style.setProperty('--dy', (Math.random() * -190 - 40) + 'px');
      giftbox.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
    launchConfetti();
    launchPetals();
    setTimeout(() => {
      lockScreen.classList.add('hidden');
      content.classList.add('revealed');
    }, 1050);
  }

  /* ---------- 交互绑定 ---------- */
  function bindBridge() {
    const btn = document.getElementById('bridgeBtn');
    const sky = document.getElementById('sky');
    const birds = document.getElementById('birds');
    const bridge = document.getElementById('bridge');
    const hint = document.getElementById('bridgeHint');
    const hearts = document.getElementById('hearts');
    if (!btn || !sky) return;
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.style.opacity = '0';
      btn.style.pointerEvents = 'none';
      hint.textContent = '喜鹊们来啦……';
      for (let i = 0; i < 8; i++) {
        const b = document.createElement('div');
        b.className = 'bird';
        b.textContent = '🕊️';
        b.style.setProperty('--from', (i % 2 === 0) ? '-30px' : 'calc(100% + 30px)');
        b.style.setProperty('--dir', (i % 2 === 0) ? '1' : '-1');
        b.style.setProperty('--land', ((i - 3.5) * 9) + 'px');
        b.style.animationDelay = (i * .14) + 's';
        birds.appendChild(b);
      }
      setTimeout(() => bridge.classList.add('built'), 1250);
      setTimeout(() => {
        sky.classList.add('met');
        hint.textContent = 'Y 和 L，相会啦 ❤';
        for (let i = 0; i < 10; i++) {
          const h = document.createElement('span');
          h.textContent = ['💗','💖','❤️'][i % 3];
          h.style.left = (40 + Math.random() * 20) + '%';
          h.style.animationDelay = (Math.random() * .6) + 's';
          hearts.appendChild(h);
        }
      }, 2300);
      setTimeout(() => { hint.textContent = '今晚的银河，为你们而亮 ✨'; }, 4400);
    });
  }

  function bindVoice() {
    const voiceBtn = document.getElementById('voiceBtn');
    const audio = document.getElementById('birthdayVoice');
    if (!voiceBtn || !audio) return;
    const play = () => {
      audio.play().then(() => {
        voiceBtn.classList.add('playing');
      }).catch(() => {});
      audio.onended = () => voiceBtn.classList.remove('playing');
    };
    voiceBtn.addEventListener('click', play);
    // 解锁手势刚结束，尝试自动播放；被浏览器拦截则点按钮听
    setTimeout(play, 700);
  }

  function bindOpening() {
    const h1 = document.querySelector('.opening h1');
    if (!h1) return;
    const text = h1.textContent;
    h1.textContent = '';
    [...text].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch;
      s.style.animationDelay = (.35 + i * .09) + 's';
      h1.appendChild(s);
    });
  }

  /* ---------- 许愿星 ---------- */
  function bindWish() {
    const input = document.getElementById('wishInput');
    const btn = document.getElementById('wishBtn');
    const tip = document.getElementById('wishTip');
    if (!input || !btn || !tip) return;
    const saved = localStorage.getItem('ylovel.wish');
    if (saved) tip.textContent = '你的愿望还挂在夜空上：' + saved;
    const submit = () => {
      const wish = input.value.trim();
      if (!wish) { tip.textContent = '先写下一个愿望哦'; return; }
      localStorage.setItem('ylovel.wish', wish);
      tip.textContent = '愿望已挂上夜空，主人会知道的 ✨';
      input.value = '';
      const rect = btn.getBoundingClientRect();
      const star = document.createElement('div');
      star.className = 'wish-star-fly';
      star.textContent = '⭐';
      star.style.left = (rect.left + rect.width / 2 - 10) + 'px';
      star.style.top = (rect.top - 6) + 'px';
      star.style.setProperty('--fx', (Math.random() * 200 - 100) + 'px');
      star.style.setProperty('--fy', (-rect.top - 60) + 'px');
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 1700);
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  }

  /* ---------- 烟花 ---------- */
  function bindFireworks() {
    const btn = document.getElementById('fireworksBtn');
    const cv = document.getElementById('fireworksCanvas');
    if (!btn || !cv) return;
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let rockets = [], particles = [], active = false, raf = 0;

    function resize() {
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
      cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    const COLORS = ['#ff6fa5', '#ffd166', '#8b5cf6', '#7be0ff', '#ff9f43', '#ff8fba'];
    function explode(x, y) {
      const n = 56, color = COLORS[Math.floor(Math.random() * COLORS.length)];
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 2.8;
        particles.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1, decay: .008 + Math.random() * .012, color,
          r: 1.2 + Math.random() * 1.6,
        });
      }
    }

    function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      rockets = rockets.filter(r => r.vy < 0.6 && r.y > 0);
      for (const r of rockets) {
        r.x += r.vx; r.y += r.vy; r.vy += .045;
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(r.x, r.y, 1.6, 0, Math.PI * 2); ctx.fill();
        if (r.vy >= .6) {
          explode(r.x, r.y);
          r.y = -1;
        }
      }
      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += .022; p.vx *= .985; p.life -= p.decay;
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (active || rockets.length || particles.length) {
        raf = requestAnimationFrame(tick);
      }
    }

    function launch() {
      rockets.push({
        x: innerWidth * (.2 + Math.random() * .6),
        y: innerHeight - 30,
        vx: (Math.random() - .5) * .9,
        vy: -(8.5 + Math.random() * 2.5),
      });
    }

    let timer = 0;
    btn.addEventListener('click', () => {
      if (!active) {
        active = true;
        cancelAnimationFrame(raf);
        tick();
        timer = setInterval(launch, 380);
        setTimeout(() => {
          active = false;
          clearInterval(timer);
        }, 6000);
      }
    });
  }

  async function unlock() {
    const password = passwordInput.value.trim();
    if (!password) {
      lockError.textContent = '先输入密码哦';
      return;
    }
    const decrypted = await tryDecrypt(password);
    if (decrypted !== null) {
      lockError.textContent = '';
      content.innerHTML = decrypted;
      bindOpening();
      bindBridge();
      bindVoice();
      bindWish();
      bindFireworks();
      openGift();
    } else {
      lockError.textContent = '密码不对，再想想哦';
      giftbox.classList.remove('shake');
      void giftbox.offsetWidth;
      giftbox.classList.add('shake');
    }
  }

  unlockBtn.addEventListener('click', unlock);
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
})();
</script>
