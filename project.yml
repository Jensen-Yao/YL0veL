name: YL0veL
options:
  bundleIdPrefix: com.ylovel
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  YL0veLPredictionKit:
    path: YL0veLPredictionKit

targets:

  YL0veL:
    type: application
    platform: iOS
    sources:
      - path: YL0veL
        excludes:
          - "Info.plist"
          - "YL0veL.entitlements"
      - path: YL0veLShared
    dependencies:
      - package: YL0veLPredictionKit
      - target: YL0veLWatch
        embed: true
      - target: YL0veLWidget
        embed: true
    info:
      path: YL0veL/Info.plist
      properties:
        CFBundleDisplayName: "Y馃挆L"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: "YL0veL 闇€瑕佽鍙栧仴搴锋暟鎹紙缁忔湡銆佸績鐜囥€佺潯鐪犮€佹墜鑵曟俯搴︾瓑锛夛紝鐢ㄤ簬鍛ㄦ湡棰勬祴涓庡仴搴峰畧鎶ゃ€傛墍鏈夋暟鎹粎淇濆瓨鍦ㄦ湰鏈猴紝涓嶄細涓婁紶銆?
        NSHealthUpdateUsageDescription: "YL0veL 闇€瑕佸皢浣犺褰曠殑缁忔湡鏁版嵁鍐欏叆銆屽仴搴枫€岮pp锛屼笌 Apple 鍋ュ悍鐢熸€佷簰閫氥€?
        NSSpeechRecognitionUsageDescription: "鐢ㄤ簬璇煶瀵硅瘽璁板綍锛氳鍑轰綘鐨勭粡鏈熶笌韬綋鐘跺喌锛孻L0veL 甯綘涓€閿褰曘€?
        NSMicrophoneUsageDescription: "鐢ㄤ簬璇煶瀵硅瘽璁板綍鏃堕噰闆嗕綘鐨勮闊炽€?
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: YL0veL/YL0veL.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.ylovel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  YL0veLWatch:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: YL0veLWatch
        excludes:
          - "Info.plist"
          - "YL0veLWatch.entitlements"
      - path: YL0veLShared
    dependencies:
      - package: YL0veLPredictionKit
      - target: YL0veLWatchWidget
        embed: true
    info:
      path: YL0veLWatch/Info.plist
      properties:
        CFBundleDisplayName: "Y馃挆L"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ylovel.app
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: "YL0veL 鎵嬭〃绔渶瑕佽鍙栧仴搴锋暟鎹敤浜庡睍绀哄懆鏈熶笌鍋ュ悍淇℃伅銆?
        NSHealthUpdateUsageDescription: "YL0veL 鎵嬭〃绔渶瑕佸啓鍏ョ粡鏈熻褰曞埌銆屽仴搴枫€嶃€?
        NSSpeechRecognitionUsageDescription: "鐢ㄤ簬鍦ㄦ墜琛ㄤ笂鐢ㄨ闊冲揩閫熻褰曠粡鏈熺姸鍐点€?
        NSMicrophoneUsageDescription: "鐢ㄤ簬鎵嬭〃璇煶璁板綍銆?
