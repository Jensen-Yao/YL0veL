        com.apple.security.application-groups:
          - group.com.ylovel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.app.watch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  YL0veLWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: YL0veLWatchWidget
        excludes:
          - "Info.plist"
      - path: YL0veLShared
    info:
      path: YL0veLWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: "Y馃挆L 澶嶆潅鍔熻兘"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: YL0veLWatchWidget/YL0veLWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ylovel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.app.watch.widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  YL0veLWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: YL0veLWidget
        excludes:
          - "Info.plist"
      - path: YL0veLShared
    dependencies:
      - package: YL0veLPredictionKit
    info:
      path: YL0veLWidget/Info.plist
      properties:
        CFBundleDisplayName: "Y馃挆L 灏忕粍浠?
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: YL0veLWidget/YL0veLWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ylovel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  YL0veLTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/YL0veLTests
    dependencies:
      - target: YL0veL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.app.tests
        GENERATE_INFOPLIST_FILE: YES

  YL0veLPredictionKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/YL0veLPredictionKitTests
    dependencies:
      - package: YL0veLPredictionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.predictionkit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  YL0veL:
    build:
      targets:
        YL0veL: all
        YL0veLWatch: all
        YL0veLWatchWidget: all
        YL0veLWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - YL0veLTests
        - YL0veLPredictionKitTests
