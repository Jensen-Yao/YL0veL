# 侧载专用工程配置（不含 Watch 目标：免费侧载装不了手表，且避免 WKCompanionAppBundleIdentifier 问题）
name: YL0veL
options:
  bundleIdPrefix: com.ylovel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  YL0veLPredictionKit:
    path: YL0veLPredictionKit

targets:
  YL0veL:
    type: application
    platform: iOS
    sources:
      - path: YL0veL
        excludes:
          - "Info.plist"
          - "YL0veL.entitlements"
          - "Resources/NotificationSounds"
          - "Y-voice"
      - path: YL0veLShared
    resources:
      - path: YL0veL/Resources/NotificationSounds
        excludes:
          - "*.mp3"
    dependencies:
      - package: YL0veLPredictionKit
      - target: YL0veLWidget
        embed: true
    info:
      path: YL0veL/Info.plist
      properties:
        CFBundleDisplayName: "Y💗L"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: "YL0veL 需要读取健康数据（经期、心率、睡眠、手腕温度等），用于周期预测与健康守护。所有数据仅保存在本机，不会上传。"
        NSHealthUpdateUsageDescription: "YL0veL 需要将你记录的经期数据写入「健康」App，与 Apple 健康生态互通。"
        NSSpeechRecognitionUsageDescription: "用于语音对话记录：说出你的经期与身体状况，YL0veL 帮你一键记录。"
        NSMicrophoneUsageDescription: "用于语音对话记录时采集你的语音。"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: YL0veL/YL0veL.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.ylovel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  YL0veLWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: YL0veLWidget
        excludes:
          - "Info.plist"
      - path: YL0veLShared
    dependencies:
      - package: YL0veLPredictionKit
    info:
      path: YL0veLWidget/Info.plist
      properties:
        CFBundleDisplayName: "Y💗L 小组件"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: YL0veLWidget/YL0veLWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ylovel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ylovel.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  YL0veL:
    build:
      targets:
        YL0veL: all
        YL0veLWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: []
